<title>FCH Cabana 3D - Jones Steel Design</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen shop-floor viewer - mark header, full-bleed 3D stage, view bar, slide-up parts list */
:root{
  --navy:#2f3a4f; --navy-deep:#1f2735; --ink:#eef1f5; --muted:#9aa6b8; --line:#46526a;
  --gold:#d9b064; --steel:#b9c2cc; --pick:#ffffff; --weld:#e2683c; --dim:#f3e3b5; --spark:#ffc642; --hole:#7fd1c7;
  --display:"Saira Condensed","Agency FB","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--navy-deep);color:var(--ink);font-family:var(--body);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{background:var(--navy);border-bottom:2px solid var(--gold);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:38px;width:auto;display:block}
.id{flex:1;min-width:0}
.mark{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;letter-spacing:.02em}
.sub{font-family:var(--display);font-weight:500;font-size:1.02rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{color:var(--gold);font-weight:700}
select{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;background:var(--navy-deep);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.pdfbtn{font-family:var(--display);font-weight:700;font-size:.98rem;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-deep);background:var(--gold);text-decoration:none;border-radius:4px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px}
.pdfbtn::before{content:"";width:12px;height:14px;background:linear-gradient(var(--navy-deep),var(--navy-deep)) 3px 5px/6px 1.5px no-repeat,linear-gradient(var(--navy-deep),var(--navy-deep)) 3px 8px/6px 1.5px no-repeat,linear-gradient(var(--navy-deep),var(--navy-deep)) 3px 11px/4px 1.5px no-repeat;border:1.5px solid var(--navy-deep);border-radius:1.5px;box-sizing:border-box}
.pdfbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;font-size:.78rem;color:var(--muted);letter-spacing:.03em;pointer-events:none}
.proj{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;text-align:right;font-family:var(--display);font-size:.85rem;letter-spacing:.06em;color:var(--muted);pointer-events:none;text-transform:uppercase}
.bar{background:var(--navy);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font-family:var(--display);font-weight:700;font-size:.98rem;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;min-height:40px}
button[aria-pressed="true"]{background:var(--gold);color:var(--navy-deep);border-color:var(--gold)}
.spacer{flex:1}
#partsBtn{border-color:var(--gold);color:var(--gold)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:55%;overflow:auto;background:var(--navy);border-top:2px solid var(--gold);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:rgba(255,255,255,.04)}
tr.sel td{background:rgba(217,176,100,.18)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
tfoot td{font-family:var(--display);font-weight:700;letter-spacing:.05em;border-bottom:0}
#sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#lead path{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.85}
#lead circle{fill:var(--ink)}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;cursor:pointer;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:.04em;line-height:1;padding:4px 7px;border-radius:3px;background:rgba(31,39,53,.88);border:1px solid var(--steel);color:var(--ink)}
.tag.main{border-color:var(--gold);color:var(--gold)}
.tag.sel{background:var(--gold);color:var(--navy-deep);border-color:var(--gold)}
.tag.hole{border-color:var(--hole);color:var(--hole)}
.tag.weld{padding:0;background:rgba(31,39,53,.9);border-color:var(--weld)}
.tag.weld svg{display:block}
.dim{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:.92rem;letter-spacing:.03em;color:var(--dim);background:rgba(31,39,53,.82);padding:1px 5px;border-radius:2px;transform-origin:0 0}
.dim.meas{color:var(--navy-deep);background:var(--dim);font-size:1.05rem;padding:3px 8px}
#measHint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.05em;color:var(--navy-deep);background:var(--dim);padding:6px 12px;border-radius:4px;pointer-events:none}
.tag.weld text{font-family:var(--display);font-weight:700;fill:var(--ink)}
.tag small{font-weight:500;color:var(--muted);margin-left:2px}
.tag.sel small{color:var(--navy-deep)}
#pvbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--navy);border:1px solid var(--gold);border-radius:6px;padding:5px 6px;max-width:calc(100% - 24px);z-index:3}
#pvbar .pvt{font-family:var(--display);font-weight:800;letter-spacing:.04em;color:var(--gold);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pvbar .pvt small{color:var(--muted);font-weight:500;margin-left:6px}
#pvbar button{min-height:34px;padding:5px 10px}
.pv{min-height:30px;padding:3px 9px;font-size:.85rem;border-color:var(--gold);color:var(--gold)}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
@media (max-width:520px){.tag{font-size:.8rem;padding:3px 5px} .mark{font-size:1.65rem} header img{height:30px} .hint{display:none} button{padding:8px 9px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<style>*,*::before,*::after{box-sizing:border-box} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} html{height:100%} body{margin:0;font-size:14px} [hidden]{display:none!important}</style>
</head>

<script>
const DATA = {"project":"FCH CABANA","job":"FCH-29473","assemblies":[{"mark":"FCHB1"},{"mark":"FCHB2"},{"mark":"FCHB3"},{"mark":"FCHB4"},{"mark":"FCHC1"},{"mark":"FCHC2"},{"mark":"M1"}]};
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv');

if (!window.THREE || !THREE.OrbitControls) {
  stage.insertAdjacentHTML('beforeend', '<div class="err">The 3D viewer could not load. Check your connection and reopen this page.</div>');
} else start();

function start(){
  const css = getComputedStyle(document.documentElement);
  const C = k => new THREE.Color(css.getPropertyValue(k).trim());
  const renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(C('--navy-deep'));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 1, 200000);
  camera.up.set(0, 0, 1);                               // Tekla is Z-up
  const controls = new THREE.OrbitControls(camera, cv);
  controls.enableDamping = true; controls.dampingFactor = 0.12;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4458, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(1, -1.4, 2); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-1.5, 1, -0.5); scene.add(fill);

  let iso = -1, asmRadius = 1, showWelds = true, zs = 1, refDist = 1; const focus = new THREE.Vector3();
  let group = null, weldMeshes = [], meshes = [], radius = 1000, current = null, selected = -1;
  const matMain = () => new THREE.MeshStandardMaterial({color: C('--gold'), metalness: .25, roughness: .55, side: THREE.DoubleSide});
  const matSec  = () => new THREE.MeshStandardMaterial({color: C('--steel'), metalness: .35, roughness: .5, side: THREE.DoubleSide});

  function partGeometry(faces){
    const pos = [];
    for (const loops of faces){
      const L = loops.map(f => { const a = []; for (let i = 0; i < f.length; i += 3) a.push(new THREE.Vector3(f[i], f[i+1], f[i+2])); return a; });
      const o = L[0]; if (o.length < 3) continue;
      const n = new THREE.Vector3();                 // Newell normal
      for (let i = 0; i < o.length; i++){ const a = o[i], b = o[(i+1) % o.length];
        n.x += (a.y - b.y) * (a.z + b.z); n.y += (a.z - b.z) * (a.x + b.x); n.z += (a.x - b.x) * (a.y + b.y); }
      if (n.lengthSq() === 0) continue; n.normalize();
      const u = new THREE.Vector3().crossVectors(Math.abs(n.z) < .9 ? new THREE.Vector3(0,0,1) : new THREE.Vector3(1,0,0), n).normalize();
      const v = new THREE.Vector3().crossVectors(n, u);
      const to2 = p => new THREE.Vector2(p.dot(u), p.dot(v));
      const contour = o.map(to2), holes = L.slice(1).map(h => h.map(to2));
      const all = o.concat(...L.slice(1));
      let tris; try { tris = THREE.ShapeUtils.triangulateShape(contour, holes); } catch(e){ tris = []; }
      for (const t of tris) for (const k of t){ const p = all[k]; pos.push(p.x, p.y, p.z); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.computeVertexNormals();
    return g;
  }

  // on the website each assembly's geometry lives in data/<MARK>.json and loads when it is opened
  const loading = {};
  function show(mark){
    const a = DATA.assemblies.find(x => x.mark === mark) || DATA.assemblies[0];
    if (!a.parts){
      $('mark').textContent = a.mark; $('sub').textContent = 'Loading 3D model…'; $('pick').value = a.mark;
      if (!loading[a.mark]) loading[a.mark] = fetch('data/' + encodeURIComponent(a.mark) + '.json')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(d => Object.assign(a, d))
        .catch(() => { $('sub').textContent = 'Could not load this assembly. Check your connection and reload.'; delete loading[a.mark]; throw 0; });
      loading[a.mark].then(() => { if ($('pick').value === a.mark) show(a.mark); }, () => {});
      return;
    }
    current = a; selected = -1;
    if (group){ scene.remove(group); group.traverse(o => { o.geometry && o.geometry.dispose(); o.material && o.material.dispose(); }); }
    group = new THREE.Group(); meshes = [];
    a.parts.forEach((p, i) => {
      const g = partGeometry(p.faces);
      const m = new THREE.Mesh(g, p.main ? matMain() : matSec());
      m.userData.i = i; meshes.push(m); group.add(m);
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), new THREE.LineBasicMaterial({color: 0x1b2230}));
      m.userData.edge = e; group.add(e);
    });
    weldMeshes = [];
    (a.welds || []).forEach((wgp, gi) => wgp.beads.forEach(b => {
      const g = partGeometry(b.faces);
      const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: C('--weld'), metalness: .2, roughness: .6, side: THREE.DoubleSide}));
      m.userData.weld = gi; m.visible = showWelds; weldMeshes.push(m); group.add(m);

    const P = (x, y, z) => u.clone().multiplyScalar(x).addScaledVector(v, y).addScaledVector(w, z);
    const L = mx[0] - mn[0], Hh = mx[1] - mn[1], Ww = mx[2] - mn[2];
    const off = offset || Math.max(radius * 0.22, 140), segs = [];
    // length: along the bottom front edge, offset downward
    dimLine(P(mn[0], mn[1], mx[2]), P(mx[0], mn[1], mx[2]), -off, v, ftin(L), dimLabels, segs);
    // height (depth): at the start end, offset backward along -u
    if (Hh > minDim) dimLine(P(mn[0], mn[1], mx[2]), P(mn[0], mx[1], mx[2]), -off * 0.5, u, ftin(Hh), dimLabels, segs);
    // width: at the start end on the bottom, offset backward along -u
    if (Ww > minDim) dimLine(P(mx[0], mn[1], mn[2]), P(mx[0], mn[1], mx[2]), off * 0.9, u, ftin(Ww), dimLabels, segs);
    if (extra) extra(segs, off);
    const g = new THREE.BufferGeometry().setFromPoints(segs);
    dimGroup = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color: C('--dim'), depthTest: false, transparent: true}));
    dimGroup.renderOrder = 10; dimGroup.visible = showDims;
    group.add(dimGroup);
  }
  function clearMeasure(){
    measPts = [];
    if (measObj){ group.remove(measObj.line); measObj.line.geometry.dispose(); measObj.el.remove(); measObj.dots.forEach(d => group.remove(d)); measObj = null; }
  }
  function measurePick(hit){
    // snap to the nearest corner of the tapped face when close, else the tapped point
    const m = hit.object, pa = m.geometry.attributes.position, loc = m.worldToLocal(hit.point.clone());
    let best = loc, bd = Math.max(radius * 0.02, 15);
    if (hit.face) for (const k of [hit.face.a, hit.face.b, hit.face.c]){ const q = new THREE.Vector3().fromBufferAttribute(pa, k); const d = q.distanceTo(loc); if (d < bd){ bd = d; best = q; } }
    if (measPts.length >= 2) clearMeasure();
    measPts.push(best.clone());
    if (!measObj) measObj = {dots: [], line: new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({color: C('--dim'), depthTest: false})), el: document.createElement('div')};
    const dot = new THREE.Mesh(new THREE.SphereGeometry(Math.max(radius * 0.008, 4), 12, 8), new THREE.MeshBasicMaterial({color: C('--dim'), depthTest: false}));
    dot.position.copy(best); dot.renderOrder = 11; group.add(dot); measObj.dots.push(dot);
    if (measPts.length === 2){
      measObj.line.geometry.setFromPoints(measPts); measObj.line.renderOrder = 11; group.add(measObj.line);
      const d = measPts[0].distanceTo(measPts[1]);
      measObj.el.className = 'dim meas'; measObj.el.textContent = ftin(d);
      $('dimtxt').appendChild(measObj.el);
      measObj.at = measPts[0].clone().add(measPts[1]).multiplyScalar(0.5);
      $('measHint').hidden = true;
    } else { $('measHint').textContent = 'Tap the second point'; $('measHint').hidden = false; }
  }
  const dv = new THREE.Vector3();
  function placeDimLabels(){
    const W = stage.clientWidth, H = stage.clientHeight;
    const put = (el, at) => { dv.copy(at).add(group.position).project(camera);
      const x = (dv.x + 1) / 2 * W, y = (1 - dv.y) / 2 * H;
      el.style.transform = `translate(${(x - el.offsetWidth * zs / 2).toFixed(1)}px, ${(y - el.offsetHeight * zs / 2).toFixed(1)}px) scale(${zs.toFixed(3)})`; };
    dimLabels.forEach(k => { k.el.hidden = !showDims; if (showDims) put(k.el, k.at); });
    if (measObj && measObj.at) put(measObj.el, measObj.at);
  }

  function fracIn(mm){
    const s16 = Math.round(mm / 25.4 * 16); const w = Math.floor(s16 / 16); let n = s16 % 16, d = 16;
    if (!n) return String(w);
    while (n % 2 === 0){ n /= 2; d /= 2; }
    return (w ? w + '-' : '') + n + '/' + d;
  }
  const tmpV = new THREE.Vector3();
  // welding spark at the arrow tip: an 8-ray burst that flickers (static when reduced motion is on)
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function spark(x, y, seed, sz = 1){
    const t = REDUCED ? 0 : performance.now() / 1000;
    let rays = '';
    for (let i = 0; i < 8; i++){
      const a = i * Math.PI / 4 + 0.2 + (REDUCED ? 0 : 0.15 * Math.sin(t * 7 + seed * 1.7 + i));
      const base = (i % 2 ? 6 : 10.5) * sz;
      const L = base * (REDUCED ? 1 : 0.8 + 0.35 * Math.abs(Math.sin(t * 9 + i * 1.3 + seed)));
      const r0 = 3.2 * sz;
      rays += `M${(x + Math.cos(a) * r0).toFixed(1)} ${(y + Math.sin(a) * r0).toFixed(1)}L${(x + Math.cos(a) * (r0 + L)).toFixed(1)} ${(y + Math.sin(a) * (r0 + L)).toFixed(1)}`;
    }
    const glow = REDUCED ? 0.55 : 0.4 + 0.3 * Math.abs(Math.sin(t * 11 + seed));
    return `<g class="spark"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(9 * sz).toFixed(1)}" style="fill:var(--weld);stroke:none;opacity:${glow.toFixed(2)}"/>` +
      `<path d="${rays}" style="stroke:var(--spark);stroke-width:1.8;stroke-linecap:round;fill:none"/>` +
      `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2.6 * sz).toFixed(1)}" style="fill:#fff6d6;stroke:none"/></g>`;
  }
  const sv = new THREE.Vector3(), camLocal = new THREE.Vector3(), wv = new THREE.Vector3();
  function nearCam(mesh, out){
    camLocal.copy(camera.position).sub(group.position);
    const pa = mesh.geometry.attributes.position; let bd = Infinity;
    for (let i = 0; i < pa.count; i++){ wv.fromBufferAttribute(pa, i); const d = wv.distanceToSquared(camLocal); if (d < bd){ bd = d; out.copy(wv); } }
    return out;
  }
  function weldSparks(){
    // one spark per weld symbol, at the tip of its arrow (which sits on the weld)
    const el = $('sparks');
    if (iso >= 0 || !showCalls){ el.innerHTML = ''; return; }
    el.innerHTML = calls.filter(k => k.kind === 'weld' && !k.el.hidden && k.ax != null).map(k => spark(k.ax, k.ay, k.gi, 0.85 * zs)).join('');
  }
  function layoutCallouts(){
    const svg = $('lead');
    if (!showCalls || !calls.length){ svg.innerHTML = ''; calls.forEach(k => k.el.hidden = true); return; }
    const W = stage.clientWidth, H = stage.clientHeight, M = 8, GAP = 5;
    zs = Math.max(0.65, Math.min(1.7, refDist / Math.max(camera.position.distanceTo(controls.target), 1e-3)));
    const act = calls.filter(k => (showWelds || k.kind !== 'weld') && (iso < 0 || (k.kind !== 'weld' && k.idx.includes(iso))));
    calls.forEach(k => { if (!act.includes(k)) k.el.hidden = true; });
    act.forEach(k => {
      if (k.kind === 'weld'){ const m = weldMeshes.find(w => w.userData.weld === k.gi); if (m) nearCam(m, k.local); }
      k.el.hidden = false;
      if (!k.w0){ k.w0 = k.el.offsetWidth; k.h0 = k.el.offsetHeight; }
      k.w = k.w0 * zs; k.h = k.h0 * zs;
      tmpV.copy(k.local).add(group.position).project(camera);
      k.ax = (tmpV.x + 1) / 2 * W; k.ay = (1 - tmpV.y) / 2 * H;
    });
    // place every label right next to its own part: start just outside the anchor (away from the
    // middle of the assembly), then nudge overlapping labels apart; recomputed every frame so the
    // labels follow the parts as you zoom, pan and rotate
    tmpV.copy(focus).project(camera);
    const fx = (tmpV.x + 1) / 2 * W, fy = (1 - tmpV.y) / 2 * H;
    const LEAD = (W < 520 ? 16 : 24) * Math.min(1.3, zs);
    // greedy placement: each label takes the nearest free spot around its own part (main member first,
    // then top to bottom); it keeps last frame's spot while that spot stays free, so nothing jumps
    const PAD = 4, placed = [];
    // overlap cost of a spot: 0 = fully free and on screen
    const cost = (cx, cy, w, h) => {
      let c = 0;
      const offx = Math.max(0, M - (cx - w / 2)) + Math.max(0, cx + w / 2 - (W - M));
      const offy = Math.max(0, M - (cy - h / 2)) + Math.max(0, cy + h / 2 - (H - M));
      c += (offx * h + offy * w) * 4;
      for (const o of placed){
        const ox = (w + o.w) / 2 + PAD - Math.abs(cx - o.cx), oy = (h + o.h) / 2 + PAD - Math.abs(cy - o.cy);
        if (ox > 0 && oy > 0) c += ox * oy;
      }
      return c;
    };
    const RINGS = [1, 1.8, 2.8, 4, 5.5, 7.5, 10, 13], TURNS = [0, 30, -30, 60, -60, 95, -95, 135, -135, 180];
    const order = act.slice().sort((p, q) => (q.kind === 'main') - (p.kind === 'main') || p.ay - q.ay);
    order.forEach(k => {
      let dx = k.ax - fx, dy = k.ay - fy, L = Math.hypot(dx, dy);
      if (k.kind === 'main' && iso < 0){ dx = 0; dy = -1; L = 1; }
      if (L < 1){ dx = 0.7; dy = -0.7; L = 1; }
      dx /= L; dy /= L;
      const cand = i => {
        const r = RINGS[Math.floor(i / TURNS.length)], a = TURNS[i % TURNS.length] * Math.PI / 180;
        const ux = dx * Math.cos(a) - dy * Math.sin(a), uy = dx * Math.sin(a) + dy * Math.cos(a);
        const ext = Math.abs(ux) * k.w / 2 + Math.abs(uy) * k.h / 2;
        return [k.ax + ux * (LEAD * r + ext), k.ay + uy * (LEAD * r + ext)];
      };
      const N = RINGS.length * TURNS.length;
      let pick = -1, best = Infinity, bi = 0;
      if (k.ci != null && k.ci < N){ const [cx, cy] = cand(k.ci); if (cost(cx, cy, k.w, k.h) === 0) pick = k.ci; }
      if (pick < 0) for (let i = 0; i < N; i++){
        const [cx, cy] = cand(i), c = cost(cx, cy, k.w, k.h);
        if (c === 0){ pick = i; break; }
        if (c < best){ best = c; bi = i; }
      }
      if (pick < 0) pick = bi;                                       // no free spot: least overlap
      let [cx, cy] = cand(pick); k.ci = pick;
      cx = Math.max(M + k.w / 2, Math.min(W - M - k.w / 2, cx)); cy = Math.max(M + k.h / 2, Math.min(H - M - k.h / 2, cy));
      k.cx = cx; k.cy = cy; k.px = cx; k.py = cy;
      placed.push({cx, cy, w: k.w, h: k.h});
    });
    let d = '';
    act.forEach(k => {
      // never let a label sit on top of its own anchor point
      if (Math.abs(k.ax - k.cx) < k.w / 2 + 3 && Math.abs(k.ay - k.cy) < k.h / 2 + 3){ k.cx = k.px; k.cy = k.py; }
      const x = k.cx - k.w / 2, y = k.cy - k.h / 2;
      let ex, ey;
      if (k.kind === 'weld'){
        const side = k.cx < k.ax ? 'L' : 'R';                        // junction faces the weld
        if (k.side !== side) renderWeld(k, side);
        ex = side === 'L' ? x + k.w : x; ey = y + k.h / 2;
      } else {
        ex = Math.max(x, Math.min(x + k.w, k.ax)); ey = Math.max(y, Math.min(y + k.h, k.ay));
      }
      k.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${zs.toFixed(3)})`;
      d += `M${k.ax.toFixed(1)} ${k.ay.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}`;
      k.ex = ex; k.ly = ey;
    });
    svg.innerHTML = `<path d="${d}"/>` + act.map(k => {
      if (k.kind !== 'weld') return `<circle cx="${k.ax.toFixed(1)}" cy="${k.ay.toFixed(1)}" r="2.6"/>`;
      // arrowhead pointing into the weld
      const dx = k.ax - k.ex, dy = k.ay - k.ly, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
      const bx = k.ax - ux * 9, by = k.ay - uy * 9;
      return `<path d="M${k.ax.toFixed(1)} ${k.ay.toFixed(1)}L${(bx - uy * 3.4).toFixed(1)} ${(by + ux * 3.4).toFixed(1)}L${(bx + uy * 3.4).toFixed(1)} ${(by - ux * 3.4).toFixed(1)}Z" style="fill:var(--ink);stroke:none"/>`;
    }).join('');
  }

  // ---------- part views: one part on its own, fitted, with its own dimensions and callouts
  // standard items (studs) are not listed or given part views
  function isStd(p){ return /stud|nut|washer/i.test(p.pos) || /stud|nut|washer/i.test(p.name) || /NUT|WASHER/i.test(p.profile); }
  function pvList(){ const seen = new Set(), out = []; current.parts.forEach((p, i) => { if (!isStd(p) && !seen.has(p.pos)){ seen.add(p.pos); out.push(i); } }); return out; }
  function isolate(i){
    if (i == null || !meshes[i]) return;
    iso = i; clearMeasure(); if (selected >= 0) select(selected);
    meshes.forEach((m, k) => { m.visible = k === i; m.userData.edge.visible = k === i; });
    weldMeshes.forEach(m => m.visible = false);
    const m = meshes[i]; m.geometry.computeBoundingSphere();
    const s = m.geometry.boundingSphere;
    // leave room around the part for its dimension lines
    focus.copy(s.center).add(group.position); radius = Math.max(s.radius * 1.6, 25);
    controls.minDistance = radius * .3; controls.maxDistance = radius * 12;
    const f = pcaFrame(m);
    buildDimsFor([m], f.u, f.v, 2, Math.max(s.radius * 0.3, 12), (segs, off) => arcDim(current.parts[i], segs, off * 0.8));
    const p = current.parts[i], list = pvList(), n = list.indexOf(i);
    $('pvTitle').innerHTML = `${esc(p.pos)} - ${esc(p.profile)}<small>${n + 1} of ${list.length}</small>`;
    $('pvbar').hidden = false; $('sheet').hidden = true; $('partsBtn').setAttribute('aria-expanded', 'false');
    $('pvBtn').setAttribute('aria-pressed', 'true');
    controls.autoRotate = false; $('spin').setAttribute('aria-pressed', 'false');
    setView('iso');
  }
  function stepIso(d){ const list = pvList(), n = list.indexOf(iso); isolate(list[(n + d + list.length) % list.length]); }
  function exitIso(){
    iso = -1; clearMeasure();
    meshes.forEach(m => { m.visible = true; m.userData.edge.visible = true; });
    weldMeshes.forEach(m => m.visible = showWelds);
    radius = asmRadius; focus.set(0, 0, 0);
    controls.minDistance = radius * .3; controls.maxDistance = radius * 12;
    buildDims(current);
    $('pvbar').hidden = true; $('pvBtn').setAttribute('aria-pressed', 'false');
    setView('iso');
  }

  function select(i){
    selected = (selected === i) ? -1 : i;
    meshes.forEach((m, k) => {
      const p = current.parts[k];
      m.material.color.copy(k === selected ? C('--pick') : p.main ? C('--gold') : C('--steel'));
      m.material.emissive.setHex(k === selected ? 0x333333 : 0);
      m.material.transparent = selected >= 0 && k !== selected; m.material.opacity = m.material.transparent ? .35 : 1;
    });
    document.querySelectorAll('#rows tr').forEach(tr => tr.classList.toggle('sel', +tr.dataset.i === selected));
    calls.forEach(k => k.el.classList.toggle('sel', k.idx.includes(selected)));
  }

  const dirs = {iso: [1, -1.15, .85], top: [0, -0.0001, 1], front: [0, -1, 0], side: [1, 0, 0]};
  function setView(name){
    const d = new THREE.Vector3(...dirs[name]).normalize();
    const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.aspect < 1 ? 0.95 / Math.sqrt(camera.aspect) : 1.0) * 1.12;
    camera.position.copy(focus).addScaledVector(d, dist); controls.target.copy(focus); controls.update(); refDist = dist;
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === name));
  }

  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  // tap to pick (ignore drags)
  let down = null; const ray = new THREE.Raycaster();
  cv.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
  cv.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
    const r = cv.getBoundingClientRect();
    ray.setFromCamera({x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1}, camera);
    const hit = ray.intersectObjects(meshes.filter(m => m.visible))[0];
    if (measMode){ if (hit) measurePick(hit); return; }
    if (hit) select(hit.object.userData.i); else if (selected >= 0) select(selected);
  });

  $('pick').innerHTML = DATA.assemblies.map(a => `<option value="${esc(a.mark)}">${esc(a.mark)}</option>`).join('');
  // when embedded on a website page (iframe), the scanned #MARK lives on the outer page
  const HOST = (() => { try { return window.parent !== window && window.parent.location.href ? window.parent : window; } catch(_){ return window; } })();
  const markFromHash = () => decodeURIComponent(HOST.location.hash.slice(1)).toUpperCase();
  $('pick').addEventListener('change', e => { show(e.target.value); try { HOST.history.replaceState(null, '', '#' + e.target.value); } catch(_){} });
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  $('rows').addEventListener('click', e => {
    const b = e.target.closest('.pv'); if (b){ isolate(+b.dataset.v); return; }
    const tr = e.target.closest('tr'); if (tr) select(+tr.dataset.i);
  });
  $('pvBtn').addEventListener('click', () => iso >= 0 ? exitIso() : isolate(pvList()[0]));
  $('pvBack').addEventListener('click', () => exitIso());
  $('pvPrev').addEventListener('click', () => stepIso(-1));
  $('pvNext').addEventListener('click', () => stepIso(1));
  $('partsBtn').addEventListener('click', () => { const s = $('sheet'); s.hidden = !s.hidden; $('partsBtn').setAttribute('aria-expanded', !s.hidden); });
  const spin = $('spin'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  spin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spin.setAttribute('aria-pressed', controls.autoRotate); });
  controls.autoRotateSpeed = 2.2;
  $('calls').addEventListener('click', () => { showCalls = !showCalls; $('calls').setAttribute('aria-pressed', showCalls); });
  $('welds').addEventListener('click', () => {
    showWelds = !showWelds; $('welds').setAttribute('aria-pressed', showWelds);
    if (iso < 0) weldMeshes.forEach(m => m.visible = showWelds);
  });
  $('dims').addEventListener('click', () => { showDims = !showDims; $('dims').setAttribute('aria-pressed', showDims); if (dimGroup) dimGroup.visible = showDims; });
  $('meas').addEventListener('click', () => {
    measMode = !measMode; $('meas').setAttribute('aria-pressed', measMode);
    if (measMode){ controls.autoRotate = false; $('spin').setAttribute('aria-pressed', 'false'); $('measHint').textContent = 'Tap two points on the steel'; $('measHint').hidden = false; }
    else { clearMeasure(); $('measHint').hidden = true; }
  });
  document.fonts && document.fonts.ready.then(() => calls.forEach(k => k.w0 = 0));
  HOST.addEventListener('hashchange', () => show(markFromHash()));

  show(markFromHash());
  if (!reduce){ controls.autoRotate = true; spin.setAttribute('aria-pressed', 'true'); }
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); layoutCallouts(); weldSparks(); placeDimLabels(); })();
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>

</body>
