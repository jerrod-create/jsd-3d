<title>Jones Steel Design 3D Viewers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--navy:#2f3a4f;--deep:#1f2735;--ink:#eef1f5;--muted:#9aa6b8;--line:#46526a;--gold:#d9b064;
  --display:"Saira Condensed","Agency FB","Arial Narrow",sans-serif;--body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--body)}
header{background:var(--navy);border-bottom:2px solid var(--gold);padding:14px max(16px,env(safe-area-inset-left))}
.hw{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:16px}
header img{height:46px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:.03em;margin:0;line-height:1}
.tag{color:var(--muted);font-size:.9rem;margin-top:4px}
main{max-width:880px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 40px;display:grid;gap:14px}
.job{background:var(--navy);border:1px solid var(--line);border-radius:6px;padding:16px}
.jh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;letter-spacing:.02em}
h2 a{color:var(--ink);text-decoration:none}
.meta,.upd{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.open{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--deep);text-decoration:none;padding:9px 14px;border-radius:4px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mk{font-family:var(--display);font-weight:700;letter-spacing:.04em;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:3px;padding:5px 9px}
.mk:hover,.mk:focus-visible{border-color:var(--gold);color:var(--gold)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{max-width:880px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 30px;color:var(--muted);font-size:.85rem}
</style>
